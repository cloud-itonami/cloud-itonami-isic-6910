name: ci

# This project is a west project in the com-junkawasaki/root superproject; its
# deps reference sibling repos via :local/root
# (../../com-junkawasaki/langgraph-clj, .../langchain-clj, and
# ../cloud-itonami-isic-8291 for the optional formation.corporate-intel
# cross-reference, ADR-2607110400 §5). All PUBLIC, so the test job
# reconstructs the workspace layout by checking them out into the expected
# relative paths -- no token needed. Same pattern as
# cloud-itonami-6310 / ai-gftd-itonami's ci.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }
      - name: clj-kondo (errors fail the build)
        run: clojure -M:lint

  test:
    runs-on: ubuntu-latest
    steps:
      # lay the west workspace out so ../../com-junkawasaki/* resolves
      - uses: actions/checkout@v4
        with: { path: orgs/cloud-itonami/cloud-itonami-isic-6910 }
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/langgraph
          path: orgs/kotoba-lang/langgraph
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/langchain
          path: orgs/kotoba-lang/langchain
      - uses: actions/checkout@v4
        with:
          repository: cloud-itonami/cloud-itonami-isic-8291
          path: orgs/cloud-itonami/cloud-itonami-isic-8291
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }
      - name: test (governor contract · phase invariants · LEI conformance · facts coverage · store parity · llm advisor)
        working-directory: orgs/cloud-itonami/cloud-itonami-isic-6910
        run: clojure -M:dev:test
